name: Hosted voice smoke test
on:
  push:
    branches: [main]
    paths:
      - app/voice_cloud.py
      - app/live.py
      - scripts/smoke_voice_public.py
      - .github/workflows/voice-smoke.yml
  workflow_dispatch:
    inputs:
      require_hosted_tts:
        description: "Require actual Groq Orpheus WAV (after accepting model terms)"
        required: false
        type: boolean
        default: false
jobs:
  hosted-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'websockets>=14,<17'
      - name: Verify one synthetic voice turn through public SADA
        env:
          REQUIRE_HOSTED_TTS: ${{ github.event_name == 'workflow_dispatch' && inputs.require_hosted_tts && '1' || '0' }}
        run: python scripts/smoke_voice_public.py
